[project]
name = "technical-doc-rag-eval"
version = "0.1.0"
description = "Technical Documentation RAG application with automated retrieval and generation evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.4",
    "fastapi>=0.165.0",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.1",
    "langchain-text-splitters>=1.1.3",
    "portalocker[win32]>=4.4.2",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
