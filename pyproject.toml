[project]
name = "technical-doc-rag-eval"
version = "0.1.0"
description = "Technical Documentation RAG application with automated retrieval and generation evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.1",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
